<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte — recherche de lieux</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<div class="brand"><span class="dot"></span>Petite Carte</div>

<div class="zoom-ctrl">
  <button id="zoomInBtn" title="Zoomer">+</button>
  <button id="zoomOutBtn" title="Dézoomer">−</button>
</div>

<div id="map"></div>

<div class="legend" id="legend"></div>

<div class="search-wrap">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Chercher une adresse, une ville, un lieu…" autocomplete="off" />
    <button id="searchBtn" title="Rechercher">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="locate-btn" id="locateBtn" title="Me localiser">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</div>

<div class="top-right-controls">
  <button class="theme-toggle" id="themeToggle" title="Basculer le mode sombre"></button>
  <div class="route-btn" id="routeBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.2 17.8 C 12 14, 10 9, 15.8 6.6"/></svg>
    <span class="label">Itinéraire</span>
  </div>
  <div class="filter-btn" id="filterBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    <span class="label">Filtres</span>
    <span class="count" id="filterCount">0</span>
  </div>
</div>

<div class="route-panel" id="routePanel">
  <h4>Calculer un itinéraire</h4>

  <div class="route-modes" id="routeModes">
    <button class="mode-btn active" data-mode="car" title="Voiture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2.5" y="13" width="19" height="6" rx="1.5"/><circle cx="7" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>
      <span>Voiture</span>
    </button>
    <button class="mode-btn" data-mode="bike" title="Vélo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-9h4l3 9M10 8h3M13 8l3 4h2"/></svg>
      <span>Vélo</span>
    </button>
    <button class="mode-btn" data-mode="foot" title="À pied">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="1.6"/><path d="M12.5 8l-2 3 1 2-2.5 6M12.5 8l3 1 1.5 3-2 1.5.5 4.5M15.5 9l3-2"/></svg>
      <span>À pied</span>
    </button>
  </div>

  <div class="route-field">
    <span class="route-dot start"></span>
    <input id="routeStart" type="text" placeholder="Point de départ" autocomplete="off" />
    <button id="routeUseLocation" title="Utiliser ma position">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
  <div class="results" id="routeStartSuggestions"></div>

  <div class="route-swap-row">
    <button id="routeSwap" title="Inverser départ et arrivée">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3v15"/><path d="M4 14l4 4 4-4"/>
        <path d="M16 21V6"/><path d="M20 10l-4-4-4 4"/>
      </svg>
    </button>
  </div>

  <div class="route-field">
    <span class="route-dot end"></span>
    <input id="routeEnd" type="text" placeholder="Point d'arrivée" autocomplete="off" />
  </div>
  <div class="results" id="routeEndSuggestions"></div>

  <div class="filter-actions">
    <button class="clear" id="routeClear">Effacer</button>
    <button class="apply" id="routeCalc">Calculer</button>
  </div>
  <div class="route-result" id="routeResult"></div>
</div>

<div class="filter-panel" id="filterPanel">
  <h4>Afficher sur la carte</h4>
  <div class="filter-list" id="filterList"></div>
  <div class="filter-actions">
    <button class="clear" id="filterClear">Effacer</button>
    <button class="apply" id="filterApply">Afficher</button>
  </div>
  <div class="filter-hint">Recherche dans la zone visible. Zoome un peu si la zone est trop grande.</div>
</div>

<div class="status" id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="logique.js?v=8"></script>
</body>
</html>
